[package]
name = "pdm-coretest"
version = "0.0.0"
edition = "2021"
publish = false
description = "Headless test/benchmark harness for ProxyDownloadManager's tauri-free download core"

[lib]
name = "pdm_coretest"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["socks", "stream", "json", "rustls-tls", "http2"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "io-util", "time", "signal"] }
futures-util = "0.3"
url = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
fs2 = "0.4"
async-trait = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
env_logger = "0.11"
